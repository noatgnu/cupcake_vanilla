name: Publish Container Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  OWNER: noatgnu
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  LATEST: ${{ github.event_name == 'release' && !github.event.release.prerelease }}

jobs:
  image:
    name: ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [cupcake-vanilla, cupcake-vanilla-ng, cupcake-webgui, cupcake-transcribe-worker]
        arch: [amd64, arm64]
        include:
          - name: cupcake-vanilla
            dockerfile: dockerfiles/Dockerfile
            description: CUPCAKE Vanilla backend
          - name: cupcake-vanilla-ng
            dockerfile: dockerfiles/Dockerfile-caprover-frontend
            description: CUPCAKE Vanilla web app served by nginx, proxying to the backend
          - name: cupcake-webgui
            dockerfile: dockerfiles/Dockerfile-caprover-lims-frontend
            description: CUPCAKE web app served by nginx, proxying to the backend
          - name: cupcake-transcribe-worker
            dockerfile: dockerfiles/Dockerfile-transcribe-worker
            description: CUPCAKE Vanilla transcription worker with whisper.cpp; models are mounted from the model cache
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Choose the image name
        id: image
        run: |
          IMAGE="${REGISTRY}/${OWNER}/${{ matrix.name }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE}:${TAG}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

      - name: Push the ${{ matrix.arch }} image
        run: |
          docker push "${{ steps.image.outputs.tag }}"
          echo "Pushed ${{ steps.image.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the image for the mirror
        run: |
          mkdir -p "mirror/images/${TAG}"
          FILE="${{ matrix.name }}-${TAG}-${{ matrix.arch }}.tar.zst"
          docker tag "${{ steps.image.outputs.tag }}" "${{ steps.image.outputs.image }}:${TAG}"
          docker save "${{ steps.image.outputs.image }}:${TAG}" | zstd -T0 -10 -q -o "mirror/images/${TAG}/${FILE}"
          (cd "mirror/images/${TAG}" && sha256sum -- "${FILE}" > "${FILE}.sha256")
          ls -la "mirror/images/${TAG}"

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}-${{ matrix.arch }}
          path: mirror/images/
          retention-days: 3
          compression-level: 0

  manifest:
    name: ${{ matrix.name }} (amd64 + arm64)
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [cupcake-vanilla, cupcake-vanilla-ng, cupcake-webgui, cupcake-transcribe-worker]
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine both architectures under the release tags
        run: |
          IMAGE="${REGISTRY}/${OWNER}/${{ matrix.name }}"
          TAGS=(-t "${IMAGE}:${TAG}")
          if [ "$LATEST" = "true" ]; then
            TAGS+=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}" | tee -a "$GITHUB_STEP_SUMMARY"

  mirror:
    name: Back up the images to the download mirror
    needs: [image, manifest]
    runs-on: ubuntu-24.04
    environment: MIRROR_HOST
    env:
      MIRROR_SSH_HOST: ${{ secrets.MIRROR_SSH_HOST }}
      MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
      MIRROR_HOST_KEY: ${{ secrets.MIRROR_HOST_KEY }}
      MIRROR_PORT: ${{ secrets.MIRROR_PORT }}
      MIRROR_URL: ${{ vars.MIRROR_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Report missing configuration
        if: env.MIRROR_SSH_HOST == ''
        run: echo "::notice::No download mirror is configured; the images are only on the GitHub container registry"

      - uses: actions/download-artifact@v4
        if: env.MIRROR_SSH_HOST != ''
        with:
          pattern: image-*
          path: mirror/images/
          merge-multiple: true

      - name: Upload to the mirror
        if: env.MIRROR_SSH_HOST != ''
        run: |
          (cd "mirror/images/${TAG}" && sha256sum -c -- *.sha256)
          bash .github/scripts/mirror-rsync.sh mirror/images/ ./
          if [ -n "$MIRROR_URL" ]; then
            URL="${MIRROR_URL%/}/cupcake/images/${TAG}/"
            for sums in mirror/images/${TAG}/*.sha256; do
              curl -fsS "${URL}$(basename "$sums")" | diff - "$sums"
            done
            echo "Backed up the images to ${URL}" >> "$GITHUB_STEP_SUMMARY"
          fi
